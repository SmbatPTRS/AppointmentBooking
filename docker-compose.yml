services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appointmentbooking}
      POSTGRES_USER: ${POSTGRES_USER:-appointment_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the API .env file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-appointmentbooking};Username=${POSTGRES_USER:-appointment_app};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      Telegram__Enabled: ${Telegram__Enabled:-false}
      Telegram__Mode: ${Telegram__Mode:-Polling}
      Telegram__BotToken: ${Telegram__BotToken:-}
      Telegram__WebhookUrl: ${Telegram__WebhookUrl:-}
      Telegram__WebhookSecret: ${Telegram__WebhookSecret:-}
      Owner__TelegramUserId: ${Owner__TelegramUserId:-0}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
