name: CI
on:
  push:
    branches: [main, development]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool restore
      - run: dotnet restore AppointmentBooking.sln
      - run: dotnet build AppointmentBooking.sln --configuration Release --no-restore
      - run: dotnet test tests/AppointmentBooking.UnitTests/AppointmentBooking.UnitTests.csproj --configuration Release --no-build --logger trx --results-directory TestResults
